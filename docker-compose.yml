name: zwave-observatory

services:
  zwave-observatory:
    # Official image on Docker Hub. Replace the default username with your
    # own, or set DOCKERHUB_USERNAME in .env.
    image: docker.io/${DOCKERHUB_USERNAME:-skidder}/zwave-observatory:latest
    # To build locally instead of pulling:
    # build: .
    container_name: zwave-observatory
    ports:
      - "${PORT:-8088}:8088"
    environment:
      # Core backends. Leave empty and the first-run wizard validates and
      # writes them to data/secrets.env on boot.
      - HASS_URL=${HASS_URL:-}
      - HASS_TOKEN=${HASS_TOKEN:-}
      - ZWJS_WS_URL=${ZWJS_WS_URL:-}
      - ZWJS_TOKEN=${ZWJS_TOKEN:-}
      # InfluxDB v2 (bucket: homeassistant).
      - INFLUXDB_URL=${INFLUXDB_URL:-}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-homeassistant}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-}
      # LLM advisor. Provider: anthropic (default) | openai | openai_compatible.
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-5}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-}
      - LLM_DAILY_TOKEN_CAP=${LLM_DAILY_TOKEN_CAP:-200000}
      # App settings.
      - DATA_DIR=/data
      - TZ=${TZ:-UTC}
    # Compose reads .env from this directory for the ${VAR} substitutions
    # above. To source a differently named secrets file instead, uncomment:
    # env_file:
    #   - .env.secrets
    volumes:
      - ./data:/data
    # Uncomment ONLY if the entrypoint reports the data dir is not writable
    # and you cannot chown the host directory (uid 10001 is the app user):
    # user: "0:0"
    restart: unless-stopped

  # Optional: local LLM advisor via Ollama. Enable with:
  #   docker compose --profile local-llm up -d
  # Then set in .env:
  #   LLM_PROVIDER=openai_compatible
  #   LLM_MODEL=qwen3:8b
  #   LLM_BASE_URL=http://ollama:11434/v1
  # Note: qwen3:8b needs roughly 8GB of free RAM.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   profiles:
  #     - local-llm
  #   volumes:
  #     - ./data/ollama:/root/.ollama
  #   restart: unless-stopped

  # Optional: join an existing external Docker network (for example one
  # shared with Home Assistant) instead of the default network.
  #
  # networks:
  #   default:
  #     name: my-existing-network
  #     external: true
